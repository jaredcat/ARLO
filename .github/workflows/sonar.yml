name: SonarQube

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    # Fork PRs do not receive secrets; skip so community PRs stay green.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check SonarQube config
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::SONAR_TOKEN is empty. Add it as a repository Secret."
            exit 1
          fi
          if [ -z "${SONAR_HOST_URL}" ]; then
            echo "::error::SONAR_HOST_URL is empty. Add it as a repository Variable or Secret, including the scheme (e.g. https://sonar.example.com)."
            exit 1
          fi
          case "${SONAR_HOST_URL}" in
            http://*|https://*) ;;
            *)
              echo "::error::SONAR_HOST_URL must start with http:// or https://"
              exit 1
              ;;
          esac

      # Same system libs as CI so Wayland/GI tests can import.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libcairo2-dev \
            libgirepository-2.0-dev \
            gobject-introspection \
            gir1.2-glib-2.0 \
            libglib2.0-dev \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Pytest with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          uv run --frozen --no-sync pytest
          --cov
          --cov-report=xml:coverage.xml
          --cov-report=term-missing

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
