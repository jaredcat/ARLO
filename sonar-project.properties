sonar.projectKey=arlo
sonar.projectName=arlo

# Matches pyproject requires-python >=3.11,<3.14
sonar.python.version=3.11,3.12,3.13

sonar.sources=src,update_db.py
sonar.tests=tests

sonar.sourceEncoding=UTF-8

sonar.exclusions=**/__pycache__/**,**/.*/**
sonar.test.exclusions=**/__pycache__/**

# Cobertura XML from `pytest --cov --cov-report=xml` (see sonar.yml).
sonar.python.coverage.reportPaths=coverage.xml

# Wiki/API scraper is inherently branchy; S3776 there is reviewed separately.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/update_db.py
